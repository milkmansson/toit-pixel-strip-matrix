name: pixel-strip-matrix
description: Support for using strips of WS2812b LEDs, configured in array patterns
  (eg 16x16) to use the display modules in toit.
environment:
  sdk: ^2.0.0-alpha.188
dependencies:
  color_tft:
    url: github.com/toitware/toit-color-tft
    version: ^2.1.0
  e-paper:
    url: github.com/toitware/toit-e-paper
    version: ^1.2.0
  font_tiny:
    url: github.com/toitlang/pkg-font-tiny
    version: ^0.1.0
  font_x11_adobe:
    url: github.com/toitlang/pkg-font-x11-adobe
    version: ^0.1.0
  pixel_display:
    url: github.com/toitware/toit-pixel-display
    version: ^2.11.0
  pixel_strip:
    url: github.com/toitware/toit-pixel-strip
    version: ^1.3.0
